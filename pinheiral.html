<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Crônicas de Pinheiral</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--g:#ffd166;--p:rgba(14,20,36,.9)}
html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.o{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(#1d3a2a,#0b1220);z-index:9;padding:16px;box-sizing:border-box}
.o h1{font-size:clamp(26px,7vh,52px);margin:0 0 6px;color:var(--g);text-shadow:0 3px 0 #7a4a00}.o p{margin:4px 0 14px;opacity:.85;max-width:560px;font-size:clamp(13px,3.2vh,18px)}
button{font:inherit;color:#fff;background:#2a9d8f;border:0;border-bottom:4px solid #1b6b61;border-radius:12px;padding:10px 22px;margin:4px;font-weight:700;font-size:clamp(14px,3.6vh,20px)}button:active{transform:translateY(2px)}
#rot{display:none;z-index:20;background:#0b1220}
@media (orientation:portrait){#rot{display:flex}}
#dlg{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(100% - 215px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-width:760px;background:var(--p);border:3px solid var(--g);border-radius:14px;padding:10px 14px;display:none;z-index:6;box-sizing:border-box;min-height:84px}
#nm{color:var(--g);font-weight:800;font-size:clamp(13px,3vh,17px);margin-bottom:3px}#tx{font-size:clamp(14px,3.4vh,19px);line-height:1.35}#ch{margin-top:6px}#nx{position:absolute;right:12px;bottom:6px;color:var(--g);animation:b 1s infinite}@keyframes b{50%{transform:translateY(3px)}}
.ctl{position:fixed;z-index:5;touch-action:none}
#jz{left:0;top:0;width:50%;height:100%}#jb{position:fixed;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);display:none;z-index:5}
#jk{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
.bt{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.55);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border-bottom-width:3px}
#bB{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));background:rgba(230,57,70,.4)}#bA{right:calc(100px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(42,157,143,.45)}
.sb{width:42px;height:42px;font-size:18px;border-radius:10px;top:calc(8px + env(safe-area-inset-top,0px));padding:0;margin:0}#fsb{right:calc(8px + env(safe-area-inset-right,0px))}#jrb{right:calc(58px + env(safe-area-inset-right,0px))}#mub{right:calc(108px + env(safe-area-inset-right,0px))}
#jr{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--p);border:3px solid var(--g);border-radius:14px;padding:14px 18px;z-index:8;display:none;min-width:min(420px,80%);font-size:clamp(13px,3.2vh,17px)}#jr h3{margin:0 0 8px;color:var(--g)}#jr div{margin:5px 0}
</style></head><body>
<canvas id="c"></canvas>
<div id="jz" class="ctl"></div><div id="jb"><div id="jk"></div></div>
<button id="bA" class="ctl bt">A</button><button id="bB" class="ctl bt">⚔</button>
<button id="fsb" class="ctl sb">⛶</button><button id="jrb" class="ctl sb">📜</button><button id="mub" class="ctl sb">🔊</button>
<div id="dlg"><div id="nm"></div><div id="tx"></div><div id="ch"></div><span id="nx">▼</span></div>
<div id="jr"></div>
<div id="ti" class="o" style="display:flex"><h1>Crônicas de Pinheiral</h1><div style="font-size:clamp(16px,4vh,24px);color:#9fe0c8;margin-bottom:6px">O Cristal da Aurora</div><p id="ld">Carregando aventura…</p><div id="mn" style="display:none"><button id="nw">Novo jogo</button><button id="ct" style="display:none;background:#e9a23b;border-bottom-color:#9c6a1c">Continuar</button></div><p style="font-size:12px;opacity:.55">Mova com o joystick · A conversar · ⚔ atacar</p></div>
<div id="dd" class="o"><h1>Você caiu…</h1><p>Mas um herói de Pinheiral nunca desiste. Volte à última fogueira e tente de novo.</p><button id="rb">Tentar de novo</button></div>
<div id="en" class="o"><h1>FIM</h1><p id="et"></p><button onclick="localStorage.removeItem('pinh1');location.reload()">Jogar novamente</button></div>
